version: '3.9'

services:
  kevinapp:
    image: ghcr.io/Paul00Kevin/benalcazar_kev:1.0.1
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.kevinapp.entrypoints=http"
        - "traefik.http.routers.kevinapp.rule=Host(`kevin.byronrm.com`)"
        - "traefik.http.middlewares.kevinapp-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.kevinapp.middlewares=kevinapp-https-redirect"
        - "traefik.http.routers.kevinapp-secure.entrypoints=https"
        - "traefik.http.routers.kevinapp-secure.rule=Host(`kevin.byronrm.com`)"
        - "traefik.http.routers.kevinapp-secure.tls=true"
        - "traefik.http.routers.kevinapp-secure.tls.certresolver=http"
        - "traefik.http.routers.kevinapp-secure.service=kevinapp"
        - "traefik.http.services.kevinapp.loadbalancer.server.port=8000"
        - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true



